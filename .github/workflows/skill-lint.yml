name: Skill lint
on:
  pull_request:
    paths:
      - ".github/workflows/skill-lint.yml"
      - "bin/validate-skills.sh"
      - "skills/**"

jobs:
  lint-skills:
    runs-on: ubuntu-latest
    name: Validate skill files

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check skill file structure
        run: bash bin/validate-skills.sh "$PWD"
