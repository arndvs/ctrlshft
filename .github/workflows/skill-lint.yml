name: Skill lint
on:
  pull_request:
    paths:
      - ".github/workflows/skill-lint.yml"
      - "bin/validate-skills.sh"
      - "bin/validate-skills-lock.sh"
      - "bin/generate-skills-lock.sh"
      - "skills/**"

jobs:
  lint-skills:
    runs-on: ubuntu-latest
    name: Validate skill files

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Check skill file structure
        run: bash bin/validate-skills.sh "$PWD"

      - name: Check skills-lock provenance
        run: bash bin/validate-skills-lock.sh "$PWD"
