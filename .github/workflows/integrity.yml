name: Integrity
on:
  pull_request:
    paths:
      - "global.instructions.md"
      - "CLAUDE.base.md"
      - "bin/validate-symlinks.sh"
      - "bin/drift-detect.sh"
      - "skills/**"
      - ".claude/settings.json"
      - "hooks/**"
      - "test/config-consistency.sh"
      - "package.json"
      - "bin/pipeline-label-data.sh"
      - ".github/workflows/pr-auto-copilot-review.yml"
      - ".github/workflows/integrity.yml"
      - ".github/workflows/agent-*.yml"
      - "instructions/sandcastle-pipeline.instructions.md"
      - "shft/engine/package.json"
      - "shft/engine/lib/render-pipeline-artifacts.ts"
      - "shft/engine/lib/pipeline-states.ts"
      - "shft/engine/lib/lint-pipeline-labels.ts"
      - "shft/engine/scripts/pipeline-artifacts.ts"
      - "shft/templates/labels.json"
      - ".sandcastle/labels.json"
  push:
    branches:
      - dev
      - master
      - main
    paths:
      - "global.instructions.md"
      - "CLAUDE.base.md"
      - "bin/validate-symlinks.sh"
      - "bin/drift-detect.sh"
      - "skills/**"
      - ".claude/settings.json"
      - "hooks/**"
      - "test/config-consistency.sh"
      - "package.json"
      - "bin/pipeline-label-data.sh"
      - ".github/workflows/pr-auto-copilot-review.yml"
      - ".github/workflows/integrity.yml"
      - ".github/workflows/agent-*.yml"
      - "instructions/sandcastle-pipeline.instructions.md"
      - "shft/engine/package.json"
      - "shft/engine/lib/render-pipeline-artifacts.ts"
      - "shft/engine/lib/pipeline-states.ts"
      - "shft/engine/lib/lint-pipeline-labels.ts"
      - "shft/engine/scripts/pipeline-artifacts.ts"
      - "shft/templates/labels.json"
      - ".sandcastle/labels.json"

jobs:
  integrity:
    runs-on: ubuntu-latest
    name: Validate source-of-truth and skill policy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure source-of-truth language exists
        run: |
          set -euo pipefail

          if ! grep -qi "source of truth" global.instructions.md; then
            echo "✗ global.instructions.md is missing source-of-truth language"
            exit 1
          fi

          if ! grep -qi "source of truth" CLAUDE.base.md; then
            echo "✗ CLAUDE.base.md is missing source-of-truth language"
            exit 1
          fi

          echo "✓ Source-of-truth language found in required files"

      - name: Ensure deprecated skill flag is absent
        run: |
          set -euo pipefail

          if grep -Rin --include="SKILL.md" "disable-model-invocation" skills; then
            echo "✗ Found deprecated disable-model-invocation flag"
            exit 1
          fi

          echo "✓ No deprecated skill flags detected"

      - name: Run static integrity checks
        run: |
          set -euo pipefail
          bash bin/validate-symlinks.sh --ci

      - name: Config consistency (fail loud on source-of-truth drift)
        run: |
          set -euo pipefail
          bash test/config-consistency.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install engine dependencies
        run: |
          corepack enable
          cd shft/engine
          pnpm --ignore-workspace install --frozen-lockfile

      - name: Lint pipeline label transitions
        working-directory: shft/engine
        run: |
          set -euo pipefail
          pnpm exec tsx lib/lint-pipeline-labels.ts

      - name: Check generated pipeline artifacts
        working-directory: shft/engine
        run: |
          set -euo pipefail
          pnpm pipeline-artifacts:check
