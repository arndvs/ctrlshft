name: "Main PR source guard"

on:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  validate-main-pr-source:
    runs-on: ubuntu-latest
    name: Validate main PR source

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Require dev promotion path
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          case "$GITHUB_BASE_REF" in
            main|master)
              # The drift workflow (sandcastle-drift.yml) opens sandcastle/*
              # PRs that only touch .sandcastle/hub-version.json — a bot
              # pin-review, not a code promotion. Allow those through; every
              # other PR to main must come from dev.
              if [[ "$GITHUB_HEAD_REF" == sandcastle/* ]]; then
                echo "PR source accepted (sandcastle pin-review): $GITHUB_HEAD_REF -> $GITHUB_BASE_REF"
                exit 0
              fi
              if [[ "$GITHUB_HEAD_REF" != "dev" ]]; then
                echo "PRs targeting $GITHUB_BASE_REF must come from dev, not $GITHUB_HEAD_REF." >&2
                echo "Use the promotion path: feature branch -> dev, then dev -> $GITHUB_BASE_REF." >&2
                exit 1
              fi
              ;;
          esac

          echo "PR source accepted: $GITHUB_HEAD_REF -> $GITHUB_BASE_REF"
