name: "Agent: Merge PR"

on:
  pull_request_target:
    types: [labeled]

jobs:
  refuse-fork:
    if: github.event.label.name == 'agent:merge' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}

    steps:
      - name: Block unsafe fork execution
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "agent:merge" -R ${{ github.repository }} || true
          gh pr edit "$PR_NUMBER" --add-label "agent:blocked" -R ${{ github.repository }} || true
          gh pr comment "$PR_NUMBER" -R ${{ github.repository }} --body "Refused to run \`agent:merge\`: this workflow uses \`pull_request_target\` and cannot safely execute agent code for fork PRs. Recreate the PR from a branch in this repository, or merge manually after review."

  merge:
    if: github.event.label.name == 'agent:merge' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: agent-mutate-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    permissions:
      contents: write
      pull-requests: write
      issues: write

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Checkout workflow actions
        uses: actions/checkout@v4
        with:
          ref: {{DEFAULT_BRANCH}}

      - name: Sandcastle setup
        uses: ./.github/actions/sandcastle-setup
        with:
          trigger-label: agent:merge
          object-type: pr
          object-number: ${{ env.PR_NUMBER }}
          checkout-ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Mark PR ready (un-draft)
        env:
          GITHUB_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          is_draft=$(gh pr view "$PR_NUMBER" -R ${{ github.repository }} --json isDraft --jq '.isDraft')
          if [ "$is_draft" = "true" ]; then
            gh pr ready "$PR_NUMBER" -R ${{ github.repository }}
          else
            echo "PR #$PR_NUMBER is already marked ready; skipping."
          fi

      - name: Run merge
        env:
          GITHUB_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.LITELLM_MASTER_KEY }}
        run: |
          cd .sandcastle/engine
          pnpm --ignore-workspace exec tsx ../run.ts merge-pr \
            --pr ${{ github.event.pull_request.number }}

      - name: Sandcastle teardown
        if: always()
        uses: ./.github/actions/sandcastle-teardown
        with:
          trigger-label: agent:merge
          object-type: pr
          object-number: ${{ env.PR_NUMBER }}
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          job-status: ${{ job.status }}
