name: "Agent: Check Stale PRs"

on:
  schedule:
    - cron: "17 9 * * 1-5"
  workflow_dispatch:

jobs:
  check-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout workflow actions
        uses: actions/checkout@v4
        with:
          ref: {{DEFAULT_BRANCH}}

      - name: Sandcastle setup
        uses: ./.github/actions/sandcastle-setup
        with:
          checkout-ref: {{DEFAULT_BRANCH}}
          skip-checkout: true
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          manage-labels: false

      - name: Check stale PRs
        env:
          GITHUB_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.LITELLM_MASTER_KEY }}
        run: |
          cd .sandcastle/engine
          pnpm --ignore-workspace exec tsx ../run.ts check-stale-prs
