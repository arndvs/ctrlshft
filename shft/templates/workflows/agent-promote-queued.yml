name: "Agent: Promote Queued"

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

concurrency:
  group: sandcastle-promote-queued
  cancel-in-progress: true

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: {{DEFAULT_BRANCH}}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install engine dependencies
        run: npm ci
        working-directory: .sandcastle

      - name: Find queued issues and run parallel workflow
        run: |
          # Check for issues labeled 'queued' that are ready for implementation
          QUEUED=$(gh issue list \
            --label "queued" \
            --state open \
            --json number,title \
            --jq 'length')

          if [ "$QUEUED" = "0" ]; then
            echo "No queued issues found"
            exit 0
          fi

          echo "Found $QUEUED queued issues — running parallel workflow"
          npx tsx .sandcastle/run.ts \
            --workflow parallel \
            --max-issues 5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
