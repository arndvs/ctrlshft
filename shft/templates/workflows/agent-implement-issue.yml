name: "Agent: Implement Issue"

on:
  issues:
    types: [labeled]

jobs:
  implement:
    if: github.event.label.name == 'agent:implement'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: sandcastle-issue-${{ github.event.issue.number }}
      cancel-in-progress: false

    permissions:
      contents: write
      issues: write
      pull-requests: write

    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}

    steps:
      - name: Checkout workflow actions
        uses: actions/checkout@v4
        with:
          ref: {{DEFAULT_BRANCH}}

      - name: Proxy preflight
        id: proxy-preflight
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.LITELLM_MASTER_KEY }}
        run: bash .sandcastle/scripts/proxy_preflight.sh

      - name: Sandcastle setup
        if: steps.proxy-preflight.outputs.should_run == 'true'
        uses: ./.github/actions/sandcastle-setup
        with:
          trigger-label: agent:implement
          object-type: issue
          object-number: ${{ env.ISSUE_NUMBER }}
          checkout-ref: {{DEFAULT_BRANCH}}
          checkout-fetch-depth: 0
          checkout-token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Compute branch name
        if: steps.proxy-preflight.outputs.should_run == 'true'
        id: branch
        run: |
          set -euo pipefail
          slug=$(echo "$ISSUE_TITLE" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' \
            | cut -c1-50)
          branch="agent/issue-${ISSUE_NUMBER}-${slug}"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Set up git identity and branch
        if: steps.proxy-preflight.outputs.should_run == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          git config user.name "claude-code[bot]"
          git config user.email "claude-code[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi

      - name: Run implement
        if: steps.proxy-preflight.outputs.should_run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.LITELLM_MASTER_KEY }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          cd .sandcastle/engine
          pnpm --ignore-workspace exec tsx ../run.ts implement-issue \
            --issue "$ISSUE_NUMBER" \
            --issue-title "$ISSUE_TITLE" \
            --branch "$BRANCH"

      - name: Push branch
        if: steps.proxy-preflight.outputs.should_run == 'true' && success()
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: git push origin "$BRANCH"

      - name: Write PR title and description
        if: steps.proxy-preflight.outputs.should_run == 'true' && success()
        env:
          GITHUB_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.LITELLM_MASTER_KEY }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          cd .sandcastle/engine
          pnpm --ignore-workspace exec tsx ../run.ts write-pr \
            --issue "$ISSUE_NUMBER" \
            --issue-title "$ISSUE_TITLE" \
            --branch "$BRANCH"

      - name: Open draft PR
        if: steps.proxy-preflight.outputs.should_run == 'true' && success()
        env:
          GITHUB_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          existing_pr=$(gh pr list -R ${{ github.repository }} --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing_pr" ]; then
            echo "PR #${existing_pr} already exists for $BRANCH"
            exit 0
          fi
          PR_TITLE=$(cat "${RUNNER_TEMP}/pr_title.txt")
          PR_TITLE="${PR_TITLE:0:256}"
          gh pr create \
            -R ${{ github.repository }} \
            --draft \
            --base {{DEFAULT_BRANCH}} \
            --head "$BRANCH" \
            --title "$PR_TITLE" \
            --body-file "${RUNNER_TEMP}/pr_description.txt"

      - name: Transition label
        if: steps.proxy-preflight.outputs.should_run == 'true' && success()
        env:
          GITHUB_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit "$ISSUE_NUMBER" \
            --add-label "agent:pr-open" \
            -R ${{ github.repository }}

      - name: Sandcastle teardown
        if: always()
        uses: ./.github/actions/sandcastle-teardown
        with:
          trigger-label: agent:implement
          object-type: issue
          object-number: ${{ env.ISSUE_NUMBER }}
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          job-status: ${{ job.status }}
